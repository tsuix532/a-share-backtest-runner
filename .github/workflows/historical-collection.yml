name: Historical Data Collection Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/historical-collection.yml"
      - "config/historical_collection_pilot_v1.json"
      - "public_runner/historical_collection.py"
      - "scripts/build_historical_request.py"
      - "scripts/prepare_historical_collection.py"
      - "tests/test_historical_collection.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-collection.yml"
      - "config/historical_collection_pilot_v1.json"
      - "public_runner/historical_collection.py"
      - "scripts/build_historical_request.py"
      - "scripts/prepare_historical_collection.py"
      - "tests/test_historical_collection.py"

permissions:
  contents: read

concurrency:
  group: historical-data-pilot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      collection_id: ${{ steps.plan.outputs.collection_id }}
      entry_count: ${{ steps.plan.outputs.entry_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Freeze bounded collection matrix
        id: plan
        run: |
          python -m scripts.prepare_historical_collection \
            --config config/historical_collection_pilot_v1.json \
            --github-output "${GITHUB_OUTPUT}"

  collect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --requirement requirements.txt
      - name: Build sealed generic request
        id: request
        env:
          SEALED_JOB_KEY_B64: ${{ secrets.SEALED_JOB_KEY_B64 }}
        run: |
          python -m scripts.build_historical_request \
            --config config/historical_collection_pilot_v1.json \
            --entry-id "${{ matrix.entry_id }}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Collect bounded provider shard
        env:
          SEALED_JOB_B64: ${{ steps.request.outputs.sealed_job_b64 }}
          SEALED_JOB_SHA256: ${{ steps.request.outputs.sealed_job_sha256 }}
          SEALED_JOB_KEY_B64: ${{ secrets.SEALED_JOB_KEY_B64 }}
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.run_sealed_job \
            --job-id "${{ steps.request.outputs.job_id }}" \
            --group "${{ matrix.group }}" \
            --output-dir sealed-output
      - name: Upload ciphertext shard only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-${{ needs.prepare.outputs.collection_id }}-${{ matrix.entry_id }}-${{ steps.request.outputs.job_id }}-g${{ matrix.group }}
          path: sealed-output/*.asr
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
