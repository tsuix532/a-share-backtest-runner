name: Sealed A-share Batch Workload

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque 32-character job identifier
        required: true
        type: string
      sealed_job_b64:
        description: AES-GCM sealed request
        required: true
        type: string
      sealed_job_sha256:
        description: SHA-256 of decoded sealed request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sealed-a-share-workload-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  replay:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --requirement requirements.txt
      - name: Run sealed workload
        env:
          SEALED_JOB_B64: ${{ inputs.sealed_job_b64 }}
          SEALED_JOB_SHA256: ${{ inputs.sealed_job_sha256 }}
          SEALED_JOB_KEY_B64: ${{ secrets.SEALED_JOB_KEY_B64 }}
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.run_sealed_job \
            --job-id "${{ inputs.job_id }}" \
            --group "${{ matrix.group }}" \
            --output-dir sealed-output
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-result-${{ inputs.job_id }}-g${{ matrix.group }}
          path: sealed-output/*.asr
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
