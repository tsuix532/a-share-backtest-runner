name: Real Provider Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-smoke.yml"
      - "config/provider_smoke_v1.json"
      - "public_runner/provider_smoke.py"
      - "scripts/build_provider_smoke_request.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-smoke.yml"
      - "config/provider_smoke_v1.json"
      - "public_runner/provider_smoke.py"
      - "scripts/build_provider_smoke_request.py"

permissions:
  contents: read

concurrency:
  group: real-provider-smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [market, financial]
        group: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --requirement requirements.txt
      - name: Build sealed generic request
        id: request
        env:
          SEALED_JOB_KEY_B64: ${{ secrets.SEALED_JOB_KEY_B64 }}
        run: |
          python -m scripts.build_provider_smoke_request \
            --task "${{ matrix.task }}" \
            --run-id "${{ github.run_id }}" \
            --config config/provider_smoke_v1.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Run bounded provider smoke
        env:
          SEALED_JOB_B64: ${{ steps.request.outputs.sealed_job_b64 }}
          SEALED_JOB_SHA256: ${{ steps.request.outputs.sealed_job_sha256 }}
          SEALED_JOB_KEY_B64: ${{ secrets.SEALED_JOB_KEY_B64 }}
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.run_sealed_job \
            --job-id "${{ steps.request.outputs.job_id }}" \
            --group "${{ matrix.group }}" \
            --output-dir sealed-output
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-smoke-${{ matrix.task }}-${{ steps.request.outputs.job_id }}-g${{ matrix.group }}
          path: sealed-output/*.asr
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
