name: Historical Ciphertext Handoff

on:
  workflow_run:
    workflows: ["Historical Data Collection Pilot"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-handoff.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve a successful main historical collection run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          collection=$(python -c 'import json; print(json.load(open("config/historical_collection_pilot_v1.json", encoding="utf-8"))["collection_id"])')
          echo "collection=$collection" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/historical-collection.yml/runs?branch=main&status=success&per_page=20" \
              > historical-runs.json
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          payload = json.load(open("historical-runs.json", encoding="utf-8"))
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("head_branch") == "main"
                  and run.get("conclusion") == "success"
                  and isinstance(run.get("id"), int)
                  and isinstance(run.get("head_sha"), str)
              ):
                  print(f"run_id={run['id']}")
                  print(f"head_sha={run['head_sha']}")
                  break
          else:
              print("no successful main historical collection run exists", file=sys.stderr)
              raise SystemExit(1)
          PY
          fi
      - name: Check whether this handoff already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="handoff-${{ steps.source.outputs.collection }}-${{ steps.source.outputs.run_id }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Handoff $tag already exists; publish is idempotently complete."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download ciphertext artifacts from the resolved collection run
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: historical-*
          path: handoff-input
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Build bounded ciphertext-only handoff bundle
        if: steps.existing.outputs.exists != 'true'
        id: bundle
        run: |
          collection="${{ steps.source.outputs.collection }}"
          run_id="${{ steps.source.outputs.run_id }}"
          expected_prefix="historical-${collection}-"
          mapfile -t dirs < <(find handoff-input -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "no ciphertext artifacts were downloaded" >&2
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            [[ "$dir" == "$expected_prefix"* ]] || { echo "unexpected artifact directory: $dir" >&2; exit 1; }
            count=$(find "handoff-input/$dir" -maxdepth 1 -type f -name '*.asr' | wc -l)
            [[ "$count" -eq 1 ]] || { echo "artifact $dir must contain exactly one .asr file" >&2; exit 1; }
            if find "handoff-input/$dir" -maxdepth 1 -type f ! -name '*.asr' -print -quit | grep -q .; then
              echo "artifact $dir contains a non-ciphertext file" >&2
              exit 1
            fi
          done
          bundle="historical-handoff-${collection}-${run_id}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$bundle" -C handoff-input .
          sha256sum "$bundle" > "$bundle.sha256"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "artifact_count=${#dirs[@]}" >> "$GITHUB_OUTPUT"
      - name: Publish short-lived ciphertext prerelease
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.existing.outputs.tag }}" \
            "${{ steps.bundle.outputs.bundle }}" \
            "${{ steps.bundle.outputs.bundle }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.source.outputs.head_sha }}" \
            --title "Ciphertext handoff ${{ steps.source.outputs.collection }} / ${{ steps.source.outputs.run_id }}" \
            --notes "Temporary ciphertext-only handoff from historical collection run ${{ steps.source.outputs.run_id }}. No strategy source, acceptance gates, account state, credentials, or plaintext provider data are included. Scheduled cleanup removes old handoffs." \
            --prerelease

  cleanup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete expired ciphertext handoff releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '72 hours ago' +%s)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isPrerelease > releases.json
          python - "$cutoff" <<'PY' > expired.txt
          import datetime as dt
          import json
          import sys

          cutoff = int(sys.argv[1])
          for release in json.load(open("releases.json", encoding="utf-8")):
              tag = release.get("tagName", "")
              created = release.get("createdAt", "")
              if not release.get("isPrerelease") or not tag.startswith("handoff-"):
                  continue
              when = dt.datetime.fromisoformat(created.replace("Z", "+00:00"))
              if int(when.timestamp()) < cutoff:
                  print(tag)
          PY
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < expired.txt
