[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-backtest-runner"
version = "0.1.0"
description = "Strategy-blind sealed daily order replay runner"
requires-python = ">=3.11"
dependencies = ["cryptography==45.0.6"]

[tool.setuptools.packages.find]
include = ["public_runner*"]

